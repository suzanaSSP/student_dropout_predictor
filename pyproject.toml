[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "competitions"
version = "0.0.1"
description = "Data Science Competition Project"
authors = [
  { name = "the_dropouts" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
requires-python = "~=3.1.0"


[tool.ruff]
line-length = 99
src = ["competitions"]
include = ["pyproject.toml", "competitions/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["competitions"]
force-sort-within-sections = true

